name: Refresh animated homepage preview

on:
  push:
    branches: [main]
    paths:
      - "source/EXPORT-MANIFEST.json"
      - ".github/workflows/capture-homepage-preview.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: homepage-preview
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg gifsicle

      - name: Install Playwright and Chromium
        run: |
          mkdir -p /tmp/radar-preview
          npm install --prefix /tmp/radar-preview playwright
          cd /tmp/radar-preview
          npx playwright install --with-deps chromium

      - name: Record and render homepage GIF
        id: render
        continue-on-error: true
        run: NODE_PATH=/tmp/radar-preview/node_modules node scripts/capture-homepage-preview.cjs

      - name: Commit updated preview
        id: publish
        if: steps.render.outcome == 'success'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/homepage-preview.gif
          if git diff --cached --quiet; then
            echo "Homepage preview is already up to date."
            exit 0
          fi
          git commit -m "Update animated homepage preview"
          git fetch origin main
          git rebase origin/main
          preview_commit="$(git rev-parse HEAD)"
          PREVIEW_COMMIT="$preview_commit" node - <<'NODE'
          const fs = require('node:fs');
          const filename = 'README.md';
          const url = 'https://raw.githubusercontent.com/Koko08071/Tech-radar/' + process.env.PREVIEW_COMMIT + '/docs/homepage-preview.gif';
          const old = fs.readFileSync(filename, 'utf8');
          const updated = old.replace(/(\[!\[[^\n]*?\]\()(?:(?:https:\/\/raw\.githubusercontent\.com\/Koko08071\/Tech-radar\/[^/]+\/)?docs\/homepage-preview\.gif)(\)\]\()/, (_, a, b) => a + url + b);
          if (updated === old) throw new Error('README preview reference not found');
          fs.writeFileSync(filename, updated);
          NODE
          git add README.md
          git commit -m "Refresh versioned README preview reference"
          git push origin HEAD:main

      - name: Report optional preview result
        if: always()
        run: |
          if [ "${{ steps.render.outcome }}" = "failure" ] || [ "${{ steps.publish.outcome }}" = "failure" ]; then
            echo "::warning::Optional README preview refresh failed; previous GIF preserved. See capture or publish step logs."
            echo "### Preview refresh warning" >> "$GITHUB_STEP_SUMMARY"
            echo "The optional GIF refresh did not complete. Existing preview remains available. Investigate the step logs; production website deployment is independent." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Preview refresh completed" >> "$GITHUB_STEP_SUMMARY"
          fi
