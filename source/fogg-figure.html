
<div class="fogg-intro">
  <div class="fogg-intro-copy">
    <h3>Fogg 行为模型：为什么用户喜欢，却未必天天用？</h3>
    <p class="rice-deck">让行为真正发生，需要<strong>动机（Motivation）、能力（Ability）与提示（Prompt）</strong>在同一时刻相遇。光有兴趣，不等于用户会采取行动。</p>
  </div>
  <span class="fogg-formula" aria-label="行为等于动机、能力和提示同时具备">B = M · A · P<small>AT THE SAME MOMENT</small></span>
</div>

    <div class="fogg-diagram-guide">
      <div class="fogg-guide-item"><span class="fogg-guide-dot good"></span><div><strong>曲线上方 · 可以触发</strong><p>动机与行动能力达到一定组合时，一个合适的提示更可能促成行为。</p></div></div>
      <div class="fogg-guide-item"><span class="fogg-guide-dot caution"></span><div><strong>曲线下方 · 先降阻力</strong><p>单纯增加提醒往往不够。先让任务更容易，或提升真正的使用价值。</p></div></div>
      <div class="fogg-guide-takeaway">关键理解：动机与能力可以互相补偿，但<strong>还需要恰当时机的 Prompt。</strong></div>
